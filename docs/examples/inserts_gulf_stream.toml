# Band inserts fitted into a finished run (decisions B181, B182, B186; experimental: rows can fold at sharp coast
# features, and such a result is invalid):
#     python -m meshom.insert --run RUN_DIR --config docs/examples/inserts_gulf_stream.toml [--out DIR]
# Each [[inserts]] entry is built and written as insert_<name>.* (and fesom-insert_<name>/ when the run wrote model
# files); a refused or invalid entry says why in its .json and the log.
#
# - gulf_stream: a current corridor in open water along the Gulf Stream from off Georgia (30.3 N) past Cape Hatteras
#   to 40 N 50 W. The corridor's host loop lies width_km / 2 either side of the axis and must stay in open water, so
#   the axis runs about 200 km off the shelf between 32 N and 35 N: the corridor cannot start at the Florida Strait
#   exit (27.5 N), where the strait is 80-100 km wide. The fine size each host allows is set by the room rule: the
#   size grows from h_fine_m to the host's at 0.12 per unit distance (the 15 % rule), so the half width must hold
#   (h_host - h_fine) / 0.12 plus half the fine band:
#     ng5_B (host ~11.6 km near the axis):   h_fine 5 km, growth 55 km, width 200 km -> a fine band ~90 km wide;
#     ORCA025 (host ~22 km near the axis):    h_fine 8 km, growth 117 km, width 300 km -> a fine band ~65 km wide.
#   A finer core needs a wider corridor (or a finer host); the size floor h_min_m (default: the host's smallest cell)
#   bounds h_fine_m from below.
# - portugal: a coastal strip along the Portuguese coast, 37.3-41.8 N; the strip's width is the distance from the
#   coast to the offshore host chain. On ng5_B this entry is invalid: its rows fold at the bridged mouth of the Tagus
#   and at Cabo Espichel (6 inverted cells left after the repair and the cleaning).

[[inserts]]
name = "gulf_stream"
kind = "corridor"
path = [[-79.0, 30.3], [-78.2, 31.5], [-76.6, 32.4], [-74.6, 33.4], [-72.8, 34.6], [-71.0, 36.0], [-68.5, 37.3],
        [-65.0, 38.4], [-60.0, 39.3], [-55.0, 39.8], [-50.0, 40.0]]
width_km = 300.0
h_fine_m = 8000.0

[[inserts]]
name = "portugal"
kind = "strip"
path = [[-8.95, 37.3], [-8.9, 37.95], [-9.0, 38.45], [-9.55, 38.75], [-9.45, 39.4], [-8.95, 40.2], [-8.8, 41.1],
        [-8.95, 41.8]]
width_km = 50.0
h_fine_m = 2500.0
h_min_m = 1000.0
