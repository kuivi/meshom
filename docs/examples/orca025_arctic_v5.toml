# ORCA025 + the Arctic as ORCA12, joined by the ladder (v5, B117; version 5 of the design, 2026-10-28): NEMO's ORCA025 up to
# its F row 761 (the last lying wholly south of 56 N: 45.57-55.85 N), ORCA12 = ORCA025 x 3 on the same
# map from its F row 2403 (the last lying wholly south of 62 N: 47.20-61.97 N) to the fold, FESOM3's rules on
# both (B94); between the two plain rows meshom.orca.ladder's strip in ORCA's index space (B114-B116), cut by the
# coast. h: ORCA025's own cell size (B101) x 3^-(1 - t) between the two rows (B110). Penny Strait at least 150 m (O35).
# Written by scripts/orca025_arctic_v5.py.
[mesh]
method = "m16_orca"
out = ".tmp/runs/orca025_arctic_v5"
format = "fesom3"
fesom3_ini = "/work/ab0995/a270126/projects/mesh_generation/fesom_F_build/build_intel_dp/bin/fesom_ini"

[mesh.opts]
orca = "ORCA025"
mask = "fesom3"
levels_dir = ".tmp/orca_levels"
ref_dir = ".tmp/orca_refs"
gebco = "/work/ab0995/a270126/projects/mesh_generation/bathymetry/GEBCO_2024.nc"
