variable = "elevation"
min_depth_m = 10.0
depth_at = "cells_deepest"
levels = "core2"
min_layers = 4
smooth_passes = 4

[[bathymetry.regions]]
# Penny Strait (Bathurst Island - Grinnell Peninsula, ~157 m) with Belcher Channel (-94.1 E, 77.17 N) and the north
