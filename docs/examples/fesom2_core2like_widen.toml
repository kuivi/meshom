# The CORE2-like FESOM2 mesh (docs/examples/fesom2_core2like.toml) with the straits of the built-in list opened
# CORE2 style, profile "widen" (decisions C45): no strait size
# zone, each strait meshed at the background h (here the 30 km coast layer, 25 km in the north), its corridor
# max(width, (2 x 1.15 + 1/sqrt 3) h) forced to water, so every strait is >= 2 cells of that h across, widened into
# the land as CORE2 widens Gibraltar x8. The smallest cells are the background's (edges >= 21.8 km), so CORE2's
# 45-min step holds. As CORE2, the Black Sea, the Sea of Marmara and the Sea of Azov are left out: their four straits
# are not opened and, without keep_basins_km2, the cut drops them (with them widened to 86 km the forced-wet land
# around the Bosphorus takes 200-300 m depth from the box mean and the smoothing, and FESOM2 blows up there at step 7).
# This mesh: 162 705 nodes, 29/29 gates, one water component, 86/86 straits connected; FESOM2 2 days at
# 45 min without w-splitting runs. Depth as the 45-min resolve example: 30 m floor, 4 smoothing
# passes, the sill floors with a cosine taper.
# Run: sbatch --partition=interactive --cpus-per-task=16 --mem=30G --time=04:00:00 scripts/run_example.sbatch
#      docs/examples/fesom2_core2like_widen.toml
[mesh]
method = "m15_tri"
out = ".tmp/runs/fesom2_core2like_widen"
format = "fesom2"

[coast]
source = "../coastlines/GSHHS_shp/i/GSHHS_i_L1.shp"
antarctica = "ice_front"
min_area_km2 = 3000.0
treatment = "cut"
# no keep_basins_km2: the largest basin only, the Black Sea / Marmara / Azov (not opened) are dropped
straits = "fesom2_mesh_gen"           # the built-in list (meshom/data/straits_fesom2_mesh_gen.json)
strait_profile = "widen"              # no size zones: each strait at the background h (C45)
strait_widen_cells = 2                 # cells across at that h

[bathymetry]
source = "/work/ab0995/a270126/projects/mesh_generation/bathymetry/GEBCO_2024.nc"
variable = "elevation"
min_depth_m = 10.0
depth_at = "node"
levels = "core2"
min_layers = 4                         # depth >= zbar[4] = 30 m, what FESOM2 / FESOM3 raise to
smooth_passes = 4

[size]
grad_max = 0.1
h_min_m = 20000.0
h_max_m = 110000.0

[[size.layers]]
kind = "constant"
name = "open ocean, 1 degree"
h_m = 110000.0

[[size.layers]]
kind = "latitude"
name = "latitude law (CORE2: 110 km cos(lat))"
h_m = 110000.0
h_min_m = 25000.0

[[size.layers]]
kind = "coast_distance"
name = "coasts and shelves"
h_m = 30000.0
plateau_m = 30000.0
grad = 0.1

[[size.layers]]
kind = "zone"
name = "north of 52N: subpolar North Atlantic and Pacific, Nordic Seas, Arctic"
h_m = 25000.0
transition_m = 1000000.0
polygon = [[-180.0, 52.0], [-150.0, 52.0], [-120.0, 52.0], [-90.0, 52.0], [-60.0, 52.0], [-30.0, 52.0], [0.0, 52.0], [30.0, 52.0], [60.0, 52.0], [90.0, 52.0], [120.0, 52.0], [150.0, 52.0]]

[[size.layers]]
kind = "zone"
name = "Gulf Stream and North Atlantic Current"
h_m = 35000.0
transition_m = 800000.0
polygon = [[-82.0, 28.0], [-70.0, 33.0], [-50.0, 37.0], [-35.0, 44.0], [-40.0, 50.0], [-55.0, 46.0], [-72.0, 41.0], [-82.0, 34.0]]

[[size.layers]]
kind = "zone"
name = "Kuroshio and its extension"
h_m = 35000.0
transition_m = 800000.0
polygon = [[120.0, 22.0], [130.0, 26.0], [142.0, 32.0], [165.0, 34.0], [165.0, 42.0], [145.0, 43.0], [135.0, 36.0], [122.0, 28.0]]

[[size.layers]]
kind = "zone"
name = "equatorial band 1 of 3 (CORE2: about 1/2 degree within 5 degrees of the equator)"
h_m = 55000.0
transition_m = 1000000.0
polygon = [[-180.0, 3.0], [-160.0, 3.0], [-140.0, 3.0], [-120.0, 3.0], [-100.0, 3.0], [-80.0, 3.0], [-60.0, 3.0], [-60.0, -3.0], [-80.0, -3.0], [-100.0, -3.0], [-120.0, -3.0], [-140.0, -3.0], [-160.0, -3.0], [-180.0, -3.0]]

[[size.layers]]
kind = "zone"
name = "equatorial band 2 of 3 (CORE2: about 1/2 degree within 5 degrees of the equator)"
h_m = 55000.0
transition_m = 1000000.0
polygon = [[-60.0, 3.0], [-40.0, 3.0], [-20.0, 3.0], [0.0, 3.0], [20.0, 3.0], [40.0, 3.0], [60.0, 3.0], [60.0, -3.0], [40.0, -3.0], [20.0, -3.0], [0.0, -3.0], [-20.0, -3.0], [-40.0, -3.0], [-60.0, -3.0]]

[[size.layers]]
kind = "zone"
name = "equatorial band 3 of 3 (CORE2: about 1/2 degree within 5 degrees of the equator)"
h_m = 55000.0
transition_m = 1000000.0
polygon = [[60.0, 3.0], [80.0, 3.0], [100.0, 3.0], [120.0, 3.0], [140.0, 3.0], [160.0, 3.0], [180.0, 3.0], [180.0, -3.0], [160.0, -3.0], [140.0, -3.0], [120.0, -3.0], [100.0, -3.0], [80.0, -3.0], [60.0, -3.0]]

[[straits]]                            # CORE2 has no Black Sea, Marmara or Azov
name = "Bosphorus"
enabled = false

[[straits]]
name = "Dardanelles"
enabled = false

[[straits]]
name = "Marmara_West"
enabled = false

[[straits]]
name = "Kerch"
enabled = false

[run]
timeout = 3600.0
smooth = false
figures = true
