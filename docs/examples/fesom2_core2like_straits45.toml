# The 45-min variant of docs/examples/fesom2_core2like_straits.toml (2026-10-23): the CORE2-like FESOM2 mesh with the straits kept open
# with meshom's built-in strait list after D. Sein (AWI), fesom2_mesh_gen (89 straits: its 88 curated centrelines
# plus the Great Belt; meshom.straits), each with a corridor of max(width, 2 cells x h x 1.15) forced to water, a 20 km size zone
# along the path (fesom2_mesh_gen's 0.35-30 km strait sizes raised to 20 km) and the sill depth as a floor on the
# path's elements. Depth: 30 m floor (4 CORE2 layers), 4 volume-conserving smoothing passes, the floors with a cosine
# taper. With these the mesh runs FESOM2 at CORE2's 45-min step without w-splitting and FESOM3 at 30 min; with 10 km
# strait sizes the Sea of Marmara blows up at any step without w-splitting (decisions O27-O31).
# The mesh is one water component: the Black Sea is connected to the Mediterranean through the Bosphorus, the Sea of
# Marmara and the Dardanelles (the Marmara_West entry of the built-in list keeps the 13-21 km channel of western
# Marmara open at 20 km; without it the Black Sea and eastern Marmara were cut off, decisions C27, C44, O23); FESOM2
# 2 days at 45 min without w-splitting runs on it. The 10-day FESOM2 and the FESOM3 runs quoted above
# were made before that fix, on the cut-off mesh.
# Run: sbatch --partition=interactive --cpus-per-task=16 --mem=30G --time=04:00:00 scripts/run_example.sbatch
#      docs/examples/fesom2_core2like_straits45.toml
# Water: only the water connected to the world ocean (decisions C48: no lakes, no cut-off basins; keep_basins_km2
# is for special cases).
[mesh]
method = "m15_tri"
out = ".tmp/runs/fesom2_core2like_straits"
format = "fesom2"

[coast]
source = "../coastlines/GSHHS_shp/i/GSHHS_i_L1.shp"
antarctica = "ice_front"
min_area_km2 = 3000.0
treatment = "cut"
straits = "fesom2_mesh_gen"           # the built-in list (meshom/data/straits_fesom2_mesh_gen.json)
strait_h_min_m = 20000.0               # every strait h_m raised to 20 km (CORE2 45-min step, decisions C31)

[bathymetry]
source = "/work/ab0995/a270126/projects/mesh_generation/bathymetry/GEBCO_2024.nc"
variable = "elevation"
min_depth_m = 10.0
depth_at = "node"
levels = "core2"
min_layers = 4                         # depth >= zbar[4] = 30 m, what FESOM2 / FESOM3 raise to
smooth_passes = 4

[size]
grad_max = 0.1
h_min_m = 20000.0
h_max_m = 110000.0

[[size.layers]]
kind = "constant"
name = "open ocean, 1 degree"
h_m = 110000.0

[[size.layers]]
kind = "latitude"
name = "latitude law (CORE2: 110 km cos(lat))"
h_m = 110000.0
h_min_m = 25000.0

[[size.layers]]
kind = "coast_distance"
name = "coasts and shelves"
h_m = 30000.0
plateau_m = 30000.0
grad = 0.1

[[size.layers]]
kind = "zone"
name = "north of 52N: subpolar North Atlantic and Pacific, Nordic Seas, Arctic"
h_m = 25000.0
transition_m = 1000000.0
polygon = [[-180.0, 52.0], [-150.0, 52.0], [-120.0, 52.0], [-90.0, 52.0], [-60.0, 52.0], [-30.0, 52.0], [0.0, 52.0], [30.0, 52.0], [60.0, 52.0], [90.0, 52.0], [120.0, 52.0], [150.0, 52.0]]

[[size.layers]]
kind = "zone"
name = "Gulf Stream and North Atlantic Current"
h_m = 35000.0
transition_m = 800000.0
polygon = [[-82.0, 28.0], [-70.0, 33.0], [-50.0, 37.0], [-35.0, 44.0], [-40.0, 50.0], [-55.0, 46.0], [-72.0, 41.0], [-82.0, 34.0]]

[[size.layers]]
kind = "zone"
name = "Kuroshio and its extension"
h_m = 35000.0
transition_m = 800000.0
polygon = [[120.0, 22.0], [130.0, 26.0], [142.0, 32.0], [165.0, 34.0], [165.0, 42.0], [145.0, 43.0], [135.0, 36.0], [122.0, 28.0]]

[[size.layers]]
kind = "zone"
name = "equatorial band 1 of 3 (CORE2: about 1/2 degree within 5 degrees of the equator)"
h_m = 55000.0
transition_m = 1000000.0
polygon = [[-180.0, 3.0], [-160.0, 3.0], [-140.0, 3.0], [-120.0, 3.0], [-100.0, 3.0], [-80.0, 3.0], [-60.0, 3.0], [-60.0, -3.0], [-80.0, -3.0], [-100.0, -3.0], [-120.0, -3.0], [-140.0, -3.0], [-160.0, -3.0], [-180.0, -3.0]]

[[size.layers]]
kind = "zone"
name = "equatorial band 2 of 3 (CORE2: about 1/2 degree within 5 degrees of the equator)"
h_m = 55000.0
transition_m = 1000000.0
polygon = [[-60.0, 3.0], [-40.0, 3.0], [-20.0, 3.0], [0.0, 3.0], [20.0, 3.0], [40.0, 3.0], [60.0, 3.0], [60.0, -3.0], [40.0, -3.0], [20.0, -3.0], [0.0, -3.0], [-20.0, -3.0], [-40.0, -3.0], [-60.0, -3.0]]

[[size.layers]]
kind = "zone"
name = "equatorial band 3 of 3 (CORE2: about 1/2 degree within 5 degrees of the equator)"
h_m = 55000.0
transition_m = 1000000.0
polygon = [[60.0, 3.0], [80.0, 3.0], [100.0, 3.0], [120.0, 3.0], [140.0, 3.0], [160.0, 3.0], [180.0, 3.0], [180.0, -3.0], [160.0, -3.0], [140.0, -3.0], [120.0, -3.0], [100.0, -3.0], [80.0, -3.0], [60.0, -3.0]]

[run]
timeout = 3600.0
smooth = false
figures = true
